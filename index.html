<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="論文構文暗記">
<title>特別区論文 構文・テンプレート暗記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F4E79;--blue:#2E75B6;--orange:#C55A11;--green:#548235;--purple:#6B2D8B;--light:#EEF4FB;--white:#fff;--text:#2C3E50;--muted:#7F8C9A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0D1B2A;font-family:'Noto Sans JP',sans-serif;color:var(--text)}
#header{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#0D1B2A,#1a2d42);padding:env(safe-area-inset-top) 16px 0}
#header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:1px solid rgba(255,255,255,.1)}
#app-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.08em}
#mode-tabs{display:flex;gap:4px}
.mode-tab{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);background:transparent;cursor:pointer;transition:all .2s}
.mode-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
#step-bar{display:flex;gap:6px;padding:8px 0 6px;overflow-x:auto;scrollbar-width:none}
#step-bar::-webkit-scrollbar{display:none}
.step-chip{flex-shrink:0;font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);background:transparent;cursor:pointer;transition:all .2s;white-space:nowrap}
.step-chip.active{border-color:var(--orange);color:var(--orange);background:rgba(197,90,17,.1)}
#progress-area{padding:6px 0 6px}
#progress-info{display:flex;justify-content:space-between;margin-bottom:3px}
#progress-label{font-size:10px;color:rgba(255,255,255,.4)}
#progress-count{font-size:10px;font-weight:700;color:rgba(255,255,255,.7)}
#progress-track{height:3px;background:rgba(255,255,255,.1);border-radius:2px}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));border-radius:2px;transition:width .4s}
.stats-row{display:flex;gap:6px;padding:0;margin-top:4px}
.stat-badge{flex:1;background:rgba(255,255,255,.06);border-radius:8px;padding:6px;text-align:center}
.stat-num{font-size:18px;font-weight:900;color:#fff}
.stat-lbl{font-size:9px;color:rgba(255,255,255,.4);margin-top:1px;font-weight:700}
.stat-badge.ok .stat-num{color:var(--blue)}
.stat-badge.ng .stat-num{color:var(--orange)}
#main{position:fixed;top:0;left:0;right:0;bottom:0;padding-top:175px;padding-bottom:calc(80px + env(safe-area-inset-bottom));overflow:hidden}
#card-stage{position:relative;height:100%;padding:0 16px}
.card{position:absolute;inset:0;margin:0 16px;background:var(--white);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .35s cubic-bezier(.34,1.2,.64,1),opacity .25s}
.card-header{position:sticky;top:0;z-index:2;padding:14px 18px 10px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:3px}
.card-category{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.1em}
.card-title{font-size:15px;font-weight:900;color:#fff;line-height:1.35}
.card-body{padding:0 18px 20px}
.section{margin-top:14px;border-radius:10px;overflow:hidden}
.section-label{font-size:10px;font-weight:900;letter-spacing:.1em;padding:5px 12px}
.section-content{padding:12px 14px;font-size:13px;line-height:1.8;color:var(--text)}
.s-a .section-label{background:var(--orange);color:#fff}
.s-a .section-content{background:#FEF6EE}
.s-tip .section-label{background:var(--green);color:#fff}
.s-tip .section-content{background:#EEF5E8}
.s-ex .section-label{background:var(--purple);color:#fff}
.s-ex .section-content{background:#F5EEF8}
.tap-hint{margin:24px auto;text-align:center;font-size:13px;color:var(--muted);font-weight:500}
.tap-hint span{font-size:28px;display:block;margin-bottom:8px}
.card-exit-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.card-exit-right{transform:translateX(120%) rotate(8deg);opacity:0}
.card-enter{transform:translateY(40px);opacity:0}
#bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(180deg,transparent 0%,rgba(13,27,42,.95) 20%);padding:12px 20px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;align-items:center;justify-content:center}
.action-btn{flex:1;max-width:140px;height:50px;border-radius:25px;border:none;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;-webkit-appearance:none}
.btn-ng{background:rgba(197,90,17,.15);border:2px solid var(--orange);color:var(--orange)}
.btn-ok{background:var(--blue);color:#fff;box-shadow:0 4px 20px rgba(46,117,182,.4)}
.btn-flip{background:var(--navy);color:#fff;max-width:200px;box-shadow:0 4px 20px rgba(31,78,121,.5)}
.btn-next{background:var(--blue);color:#fff;max-width:200px;box-shadow:0 4px 20px rgba(46,117,182,.4)}
.action-btn:active{transform:scale(.95)}
#complete-screen{display:none;position:fixed;inset:0;background:#0D1B2A;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 24px}
#complete-screen.show{display:flex}
.complete-emoji{font-size:64px}
.complete-title{font-size:28px;font-weight:900;color:#fff}
.complete-score{font-size:16px;color:rgba(255,255,255,.6)}
.complete-score strong{color:var(--orange);font-size:40px;font-weight:900}
.restart-btn{margin-top:10px;padding:14px 40px;border-radius:30px;border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;box-shadow:0 8px 30px rgba(46,117,182,.5)}
.colloc-table{font-size:12.5px;line-height:1.7}
.colloc-pair{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;padding:5px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.colloc-pair:last-child{border-bottom:none}
.colloc-l{font-weight:900;color:var(--orange)}
.colloc-r{color:var(--text)}
</style>
</head>
<body>

<div id="header">
  <div id="header-inner">
    <div id="app-title">特別区論文 構文・テンプレ暗記</div>
    <div id="mode-tabs">
      <button class="mode-tab active" onclick="setMode('flash')">📖 閲覧</button>
      <button class="mode-tab" onclick="setMode('quiz')">🧠 テスト</button>
    </div>
  </div>
  <div id="step-bar">
    <button class="step-chip active" onclick="setStep('all')">すべて</button>
    <button class="step-chip" onclick="setStep('s2-intro')">序論構文</button>
    <button class="step-chip" onclick="setStep('s2-main')">本論構文</button>
    <button class="step-chip" onclick="setStep('s2-conc')">結論構文</button>
    <button class="step-chip" onclick="setStep('s2-vocab')">語彙</button>
    <button class="step-chip" onclick="setStep('s3-intro')">序論型</button>
    <button class="step-chip" onclick="setStep('s3-core')">本論コア</button>
    <button class="step-chip" onclick="setStep('s3-spec')">本論個別</button>
    <button class="step-chip" onclick="setStep('s3-conc')">結論型</button>
    <button class="step-chip" onclick="setStep('s4-tech')">テクニック</button>
    <button class="step-chip" onclick="setStep('s4-coll')">コロケ辞典</button>
  </div>
  <div id="progress-area">
    <div id="progress-info">
      <span id="progress-label">進捗</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="stats-row">
    <div class="stat-badge"><div class="stat-num" id="total-count">0</div><div class="stat-lbl">全カード</div></div>
    <div class="stat-badge ok"><div class="stat-num" id="ok-count">0</div><div class="stat-lbl">OK ✓</div></div>
    <div class="stat-badge ng"><div class="stat-num" id="ng-count">0</div><div class="stat-lbl">NG ✗</div></div>
  </div>
</div>

<div id="main"><div id="card-stage"></div></div>
<div id="bottom-bar"></div>
<div id="complete-screen">
  <div class="complete-emoji">🎉</div>
  <div class="complete-title">全問完了！</div>
  <div class="complete-score"><strong id="final-score">0</strong> / <span id="final-total">0</span> 正解</div>
  <button class="restart-btn" onclick="restart()">もう一度</button>
</div>

<script>
// Helper functions for color schemes
const C = {
  navy:['#1F4E79','#2E75B6'],
  blue:['#2E75B6','#4A90D9'],
  orange:['#C55A11','#E07B3A'],
  green:['#548235','#6AAF45'],
  purple:['#6B2D8B','#8B4AB8'],
};

// Build card helper
function card(step,cat,c,q,a,tip,ex){return{step,cat,color1:c[0],color2:c[1],q,a,tip,ex};}
function colloc(step,cat,c,q,pairs,tip){return{step,cat,color1:c[0],color2:c[1],q,a:pairs,tip,isColloc:true};}

const cards = [

// ═════════ Step2 序論構文（個別構文・8枚） ═════════
card('s2-intro','序論構文 ①',C.navy,'現状提示の構文「現在、〜」',
'現在、特別区では〜が大きな課題となっている。\n\n現在、〜への対応が強く求められている。\n\n現在、〜が深刻な問題となりつつある。',
'冒頭の1文目に使う最頻出構文。「現在」で始めると一気に論文らしくなる。',
'現在、特別区では少子高齢化の進行や財政状況の悪化など、多くの課題が山積している。'),

card('s2-intro','序論構文 ②',C.navy,'時代変化を示す「近年、〜化が」',
'近年、〜は〜化が進んでいる。\n\n近年、〜が急速に変化している。\n\n近年、〜の重要性が高まっている。',
'「近年」は社会変化を示す万能フレーズ。価値観の多様化、デジタル化、グローバル化など。',
'近年、住民の価値観やライフスタイルは多様化が進んでいる。'),

card('s2-intro','序論構文 ③',C.navy,'予測・見込みを示す構文',
'〜が予測されている。\n〜が見込まれている。\n〜と予想される。\n今後も〜が続くと見込まれる。',
'将来の問題深刻化を示すときに使う。データや根拠を添えるとなお良い。',
'東京湾の埋立処分場は50年以内に満杯となることが予測されている。'),

card('s2-intro','序論構文 ④',C.navy,'背景を2点挙げる構文',
'〜の背景として、大きく◯点を挙げることができる。\n\n1つ目は、〜である。\n2つ目は、〜である。\n\n〜には、主に2つの要因がある。\n第一は〜、第二は〜である。',
'背景を箇条書き的に挙げることで論理的な印象を与える。2〜3点が最適。',
'地域コミュニティが衰退している背景として、大きく2点を挙げることができる。1つ目は人口流動性の高さによる帰属意識の希薄化である。2つ目は近隣への無関心化である。'),

card('s2-intro','序論構文 ⑤',C.navy,'定義を示す構文「〜とは」',
'〜とは、〜のことである。\n\n〜とは、〜を指す概念である。\n\n〜とは、〜を意味する。',
'コンプライアンス・協働・説明責任など抽象的な概念は必ず定義から入る。',
'コンプライアンスとは、法令や社会規範を遵守することである。'),

card('s2-intro','序論構文 ⑥',C.navy,'役割を示す構文',
'〜の役割を果たしている。\n\n〜は〜において重要な役割を担っている。\n\n〜は〜の基盤となっている。',
'対象（公園・図書館・SNS等）が果たしている役割を示すときに使う。',
'スポーツは住民生活において多面的な役割を果たしている。'),

card('s2-intro','序論構文 ⑦',C.navy,'問題提起の構文「このため」',
'このため、〜することが必要である。\n\n〜していかなければならない。\n\nこのような状況において、〜が求められる。\n\nこうした中、〜が喫緊の課題となっている。',
'背景の説明から問題提起へつなぐ重要な構文。「このため」が最も自然。',
'このため、特別区においては積極的に〜に取り組んでいくことが重要である。'),

card('s2-intro','序論構文 ⑧',C.navy,'論述宣言の構文（序論の締め）',
'以上を踏まえ、〜について論じていきたい。\n\n以上のような〜を踏まえると、〜が肝要となる。\n\n以下では、〜について必要な取組を論じていく。\n\n本論文では、〜について考察していく。',
'⚠️必ず序論の最後に入れる！これがないと減点。「論じていきたい」が最も使いやすい。',
'以上を踏まえ、社会環境の変化に即応した区政運営について論じていきたい。'),

// ═════════ Step2 本論構文（個別・12枚） ═════════
card('s2-main','本論構文 ①',C.orange,'論点を列挙する「第一に〜」',
'第一に、〜である。\n第二に、〜である。\n第三に、〜である。\n\nまず、〜について述べたい。\n次に、〜についてである。\n最後に、〜について論じる。',
'最も安定した列挙形式。本論3段落の冒頭で必ず使う。',
'第一に、広聴活動の拡充である。第二に、デジタル化の推進である。第三に、民間活力の活用である。'),

card('s2-main','本論構文 ②',C.orange,'具体例を導入する「例えば」',
'例えば、〜（事例導入）\n\n具体的には、〜（具体化）\n\n近年では、〇〇区において〜が報じられていた。\n\n現在も一部の自治体では、〜が進められている。',
'必ず具体例を入れる。自治体名（足立区・世田谷区・杉並区等）を入れると説得力UP。',
'例えば、足立区では国民健康保険業務を民間委託したことで1.5億円以上の経費削減に成功している。'),

card('s2-main','本論構文 ③',C.orange,'効果を示す「〜することで」',
'〜することで、〜が可能となる。\n\n〜により、〜を実現できる。\n\n〜を進めることで、〜が見込まれる。',
'施策の後に必ず効果を書く。「可能となる」が最も自然で頻出。',
'SNSを活用することで、若者や子育て世帯など幅広い世代の意見を迅速に把握することが可能となる。'),

card('s2-main','本論構文 ④',C.orange,'波及効果「〜につながっていく」',
'〜することにより、〜につながっていく。\n\nこのような取組を進めていくことが、〜の実現に資するものである。\n\nひいては、〜の向上にも寄与していくと考える。\n\nそして、〜という相乗効果も期待できる。',
'「につながっていく」は万能の波及効果表現。「ひいては」で2次効果を示すと厚みが増す。',
'AIチャットボットを活用することで業務効率化につながり、ひいては区民サービスの向上にも寄与していくと考える。'),

card('s2-main','本論構文 ⑤',C.orange,'重要性を示す「〜が重要」',
'〜することが重要である。\n〜することが大切である。\n〜することが不可欠である。\n〜することが極めて重要である。\n\n〜することが肝要である。',
'強弱順：大切＜重要＜不可欠＜極めて重要。テーマの核心に近いほど強く。',
'区民との信頼関係を構築する上で、透明性の確保は不可欠である。'),

card('s2-main','本論構文 ⑥',C.orange,'意見を示す「〜と考える」',
'〜と考える。\n〜だと考える。\n〜が望ましいと考える。\n〜が効果的だと考える。',
'⚠️「〜と思う」はNG。必ず「〜と考える」に変換する。',
'デジタルデバイド対策としては、講習会の充実が効果的だと考える。'),

card('s2-main','本論構文 ⑦',C.orange,'提案を示す「〜してはどうか」',
'〜してはどうだろうか。\n\n〜することを提案したい。\n\n〜を検討すべきだと考える。\n\n〜の導入を進めていきたい。',
'独自の提案を示すときに使う。やや控えめな表現が好印象。',
'若者向けには、SNSを活用した区政情報の発信を強化してはどうだろうか。'),

card('s2-main','本論構文 ⑧',C.orange,'譲歩構文「もちろん〜であるが」',
'もちろん、〜であるが、〜が重要である。\n\nもちろん、〜することも大切であるが、〜していかなければならない。\n\n一方で、〜という意見もある。しかしながら、〜である。',
'本論2段落目に入れると論文に厚みが出る。バランスの取れた論者という印象を与える。',
'もちろん、デジタル化に対応が難しい高齢者への配慮も必要であるが、講習会等の支援と並行して推進していくことが重要である。'),

card('s2-main','本論構文 ⑨',C.orange,'対比「一方で／他方」',
'一方で、〜（対比）\n\n他方、〜（対比）\n\nそれに対し、〜（対比強）\n\n〜とは対照的に、〜（対比強）',
'2つの異なる視点を示すときに使う。本論全体のバランスを取る。',
'デジタル化は利便性を高める一方で、デジタル弱者を取り残す懸念もある。'),

card('s2-main','本論構文 ⑩',C.orange,'追加「また」「さらに」',
'また、〜（追加）\nさらに、〜（追加強調）\n加えて、〜（追加）\n\nこのほか、〜（補足追加）\n\nまた一方、〜（並列追加）',
'「また」は対等な追加、「さらに」は強調を伴う追加。本論2文目以降で多用。',
'広聴活動の拡充にはSNSが有効である。また、無作為抽出型モニター制度も導入していきたい。さらに、ワークショップ形式の意見交換会も検討すべきだ。'),

card('s2-main','本論構文 ⑪',C.orange,'結果展開「そして」「このため」',
'そして、〜（結果・展開）\n\nこのため、〜していきたい。\n\nそこで、〜が考えられる。\n\nしたがって、〜（論理的結論）',
'前文を受けた展開や結論を示すときに使う。',
'区民ニーズの多様化が進んでいる。このため、特別区においては多様な広聴手段を整備していきたい。'),

card('s2-main','本論構文 ⑫',C.orange,'踏まえる「〜を踏まえながら」',
'〜を踏まえながら、〜していかなければならない。\n\n〜を視野に入れて、〜することが大切である。\n\n〜の観点から、〜を進めていきたい。',
'前提条件・背景を考慮することを示す。論述全体のバランスを取る。',
'区民の多様なライフスタイルを踏まえながら、サービスを設計していかなければならない。'),

// ═════════ Step2 結論構文（個別・8枚） ═════════
card('s2-conc','結論構文 ①',C.green,'責務を示す「〜の責務である」',
'〜は、〜の責務である。\n\n〜することは、我々の責務である。\n\n〜は、特別区職員の使命である。',
'結論1段目の社会的意義パートで使う。「責務」が論文らしさを生む。',

let mode='flash', currentStep='all', deck=[], idx=0, revealed=false;
let okSet=new Set(), ngSet=new Set();
let touchStartX=0, touchStartY=0;

function buildDeck(){
  deck = currentStep==='all' ? [...cards] : cards.filter(c=>c.step===currentStep);
  idx=0; revealed=false; okSet.clear(); ngSet.clear();
  updateStats(); showCard();
}
function setStep(s){
  currentStep=s;
  document.querySelectorAll('.step-chip').forEach(el=>{
    el.classList.toggle('active', el.onclick.toString().includes(`'${s}'`));
  });
  buildDeck();
}
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-tab').forEach(el=>{
    el.classList.toggle('active', el.onclick.toString().includes(`'${m}'`));
  });
  buildDeck();
}

function makeCard(card, isQ){
  const hdr=`background:linear-gradient(135deg,${card.color1},${card.color2})`;
  let bodyA;
  if(card.isColloc){
    // Collocation cards: parse "left → right" lines and format as pairs
    const lines = card.a.split('\n').filter(l=>l.trim());
    bodyA = '<div class="colloc-table">';
    lines.forEach(line=>{
      if(line.includes('→')){
        const [l,r] = line.split('→').map(s=>s.trim());
        bodyA += `<div class="colloc-pair"><div class="colloc-l">${l}</div><div class="colloc-r">${r}</div></div>`;
      } else {
        bodyA += `<div style="padding:8px 0;font-size:11.5px;color:var(--muted);font-style:italic;">${line}</div>`;
      }
    });
    bodyA += '</div>';
  } else {
    bodyA = card.a.replace(/\n/g,'<br>');
  }
  const bodyTip = card.tip ? card.tip.replace(/\n/g,'<br>') : '';
  const bodyEx = card.ex ? card.ex.replace(/\n/g,'<br>') : '';

  if(isQ && mode==='quiz'){
    return `<div class="card">
      <div class="card-header" style="${hdr}">
        <div class="card-category">${card.cat}</div>
        <div class="card-title">${card.q.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="card-body">
        <div class="tap-hint"><span>🤔</span>内容を思い出してみよう</div>
      </div>
    </div>`;
  }

  return `<div class="card">
    <div class="card-header" style="${hdr}">
      <div class="card-category">${card.cat}</div>
      <div class="card-title">${card.q.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="card-body">
      <div class="section s-a">
        <div class="section-label">📝 ${card.isColloc?'修飾語ペア':'内容・構文'}</div>
        <div class="section-content">${bodyA}</div>
      </div>
      ${card.tip?`<div class="section s-tip">
        <div class="section-label">💡 使い方のコツ</div>
        <div class="section-content">${bodyTip}</div>
      </div>`:''}
      ${card.ex?`<div class="section s-ex">
        <div class="section-label">✏️ 用例・適用場面</div>
        <div class="section-content">${bodyEx}</div>
      </div>`:''}
    </div>
  </div>`;
}

function showCard(dir){
  const stage=document.getElementById('card-stage');
  const old=stage.querySelector('.card');
  if(old&&dir){old.classList.add(dir==='left'?'card-exit-left':'card-exit-right');setTimeout(()=>old.remove(),350);}
  else if(old){old.remove();}
  updateProgress(); updateStats();
  if(idx>=deck.length){showComplete();return;}
  const card=deck[idx];
  const el=document.createElement('div');
  el.innerHTML=makeCard(card,mode==='quiz');
  const cardEl=el.firstElementChild;
  cardEl.classList.add('card-enter');
  stage.appendChild(cardEl);
  requestAnimationFrame(()=>requestAnimationFrame(()=>cardEl.classList.remove('card-enter')));
  setupSwipe(cardEl); renderBottom();
}

function renderBottom(){
  const bar=document.getElementById('bottom-bar');
  if(mode==='flash'){
    bar.innerHTML=`<button class="action-btn btn-next" onclick="nextCard(1)">次へ →</button>`;
  } else if(!revealed){
    bar.innerHTML=`<button class="action-btn btn-flip" onclick="flipCard()">💡 答えを見る</button>`;
  } else {
    bar.innerHTML=`<button class="action-btn btn-ng" onclick="judge(false)">✗ もう一度</button><button class="action-btn btn-ok" onclick="judge(true)">✓ 覚えた！</button>`;
  }
}
function flipCard(){
  revealed=true;
  const stage=document.getElementById('card-stage');
  stage.innerHTML=makeCard(deck[idx],false);
  setupSwipe(stage.querySelector('.card')); renderBottom();
}
function judge(ok){
  if(ok){okSet.add(idx);ngSet.delete(idx);}else{ngSet.add(idx);okSet.delete(idx);}
  revealed=false; nextCard(ok?'right':'left');
}
function nextCard(dir){idx++;revealed=false;showCard(dir===1?null:dir);}

function setupSwipe(el){
  el.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){
      if(dx<0&&mode==='quiz'&&revealed)judge(true);
      else if(dx>0&&mode==='quiz'&&revealed)judge(false);
      else if(mode==='flash'&&dx<0)nextCard(1);
    }
  },{passive:true});
}

function updateProgress(){
  const n=Math.min(idx,deck.length),total=deck.length;
  document.getElementById('progress-count').textContent=`${n} / ${total}`;
  document.getElementById('progress-fill').style.width=total?`${(n/total)*100}%`:'0%';
}
function updateStats(){
  document.getElementById('total-count').textContent=deck.length;
  document.getElementById('ok-count').textContent=okSet.size;
  document.getElementById('ng-count').textContent=ngSet.size;
}
function showComplete(){
  document.getElementById('complete-screen').classList.add('show');
  document.getElementById('final-score').textContent=okSet.size;
  document.getElementById('final-total').textContent=deck.length;
}
function restart(){document.getElementById('complete-screen').classList.remove('show');buildDeck();}

// Mark colloc cards
cards.forEach(c=>{ if(c.step==='s4-coll') c.isColloc=true; });

buildDeck();
</script>
